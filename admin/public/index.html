<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JulJones Admin Dashboard</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <h1>JulJones Admin</h1>
        </div>
    </nav>

    <div class="dashboard">
        <div class="container">
            <div class="stats-grid">
                <div class="stat-card">
                    <h3>Total Orders</h3>
                    <span id="totalOrders">0</span>
                </div>
                <div class="stat-card">
                    <h3>Pending</h3>
                    <span id="pendingOrders">0</span>
                </div>
                <div class="stat-card">
                    <h3>Delivered</h3>
                    <span id="deliveredOrders">0</span>
                </div>
                <div class="stat-card">
                    <h3>Total Revenue</h3>
                    <span id="totalRevenue">₵0.00</span>
                </div>
            </div>

            <div class="tabs">
                <button class="tab-btn active" data-tab="orders">Orders</button>
                <button class="tab-btn" data-tab="transactions">Transactions</button>
                <button class="tab-btn" data-tab="deliveries">Deliveries</button>
            </div>

            <div class="tab-content">
                <div id="orders-tab" class="tab-pane active">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Customer</th>
                                <th>Items</th>
                                <th>Total</th>
                                <th>Status</th>
                                <th>Date</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="ordersBody"></tbody>
                    </table>
                </div>

                <div id="transactions-tab" class="tab-pane">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Customer</th>
                                <th>Amount</th>
                                <th>Status</th>
                                <th>Date</th>
                            </tr>
                        </thead>
                        <tbody id="transactionsBody"></tbody>
                    </table>
                </div>

                <div id="deliveries-tab" class="tab-pane">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Customer</th>
                                <th>Items</th>
                                <th>Amount</th>
                                <th>Delivered At</th>
                            </tr>
                        </thead>
                        <tbody id="deliveriesBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal" id="statusModal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h3>Update Order Status</h3>
            <select id="newStatus">
                <option value="pending">Pending</option>
                <option value="preparing">Preparing</option>
                <option value="delivering">Out for Delivery</option>
                <option value="delivered">Delivered</option>
            </select>
            <button class="btn" id="updateStatusBtn">Update</button>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
