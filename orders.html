<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My Orders | JulJones</title>

    <meta
        name="description"
        content="View and track your JulJones orders."
    >

    <link rel="stylesheet" href="style.css">

    <style>
        /* =========================================
           ORDERS PAGE
        ========================================= */

        .orders-page {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px 60px;
        }

        .orders-header {
            margin-bottom: 30px;
        }

        .orders-header h1 {
            margin-bottom: 8px;
        }

        .account-status {
            color: #666;
            font-size: 0.95rem;
        }

        .order-list {
            display: grid;
            gap: 24px;
        }

        .order-card {
            background: #fff;
            border: 1px solid #e5e5e5;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
        }

        .order-card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 20px;
            margin-bottom: 24px;
        }

        .order-number {
            margin: 0 0 6px;
            font-size: 1.35rem;
        }

        .order-date {
            margin: 0;
            color: #777;
            font-size: 0.9rem;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 7px 12px;
            border-radius: 999px;
            font-size: 0.85rem;
            font-weight: 700;
            white-space: nowrap;
        }

        .status-pending {
            background: #fff4cc;
            color: #795900;
        }

        .status-confirmed {
            background: #e8f2ff;
            color: #1557a0;
        }

        .status-preparing {
            background: #f3e8ff;
            color: #6b21a8;
        }

        .status-ready {
            background: #e5f8ec;
            color: #166534;
        }

        .status-out-for-delivery {
            background: #e6f7f7;
            color: #0f6666;
        }

        .status-completed {
            background: #dcfce7;
            color: #166534;
        }

        .status-cancelled {
            background: #fee2e2;
            color: #991b1b;
        }

        /* =========================================
           STATUS TIMELINE
        ========================================= */

        .status-timeline {
            display: flex;
            align-items: flex-start;
            margin: 30px 0;
        }

        .timeline-step {
            flex: 1;
            position: relative;
            text-align: center;
        }

        .timeline-step:not(:last-child)::after {
            content: "";
            position: absolute;
            top: 15px;
            left: 50%;
            width: 100%;
            height: 3px;
            background: #e5e5e5;
            z-index: 0;
        }

        .timeline-step.completed:not(:last-child)::after {
            background: #16a34a;
        }

        .timeline-dot {
            position: relative;
            z-index: 1;

            width: 30px;
            height: 30px;
            margin: 0 auto 8px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;
            background: #e5e5e5;
            color: #777;

            font-size: 0.8rem;
            font-weight: 700;
        }

        .timeline-step.completed .timeline-dot {
            background: #16a34a;
            color: #fff;
        }

        .timeline-step.current .timeline-dot {
            background: #111;
            color: #fff;
            box-shadow: 0 0 0 5px rgba(17, 17, 17, 0.08);
        }

        .timeline-label {
            display: block;
            font-size: 0.75rem;
            color: #888;
        }

        .timeline-step.completed .timeline-label,
        .timeline-step.current .timeline-label {
            color: #222;
            font-weight: 600;
        }

        /* =========================================
           ORDER META
        ========================================= */

        .order-meta {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;

            margin-bottom: 24px;
        }

        .meta-box {
            padding: 14px;
            background: #f8f8f8;
            border-radius: 10px;
        }

        .meta-label {
            display: block;
            margin-bottom: 4px;

            color: #777;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .meta-value {
            font-weight: 600;
        }

        /* =========================================
           ORDER ITEMS
        ========================================= */

        .order-items {
            margin: 0 0 24px;
            padding: 0;
            list-style: none;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            gap: 20px;

            padding: 12px 0;
            border-bottom: 1px solid #eee;
        }

        .order-item:last-child {
            border-bottom: none;
        }

        .item-name {
            font-weight: 600;
        }

        .item-quantity {
            color: #777;
            font-weight: 400;
        }

        .item-price {
            white-space: nowrap;
            font-weight: 600;
        }

        /* =========================================
           ORDER TOTALS
        ========================================= */

        .order-summary {
            border-top: 1px solid #eee;
            padding-top: 18px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .summary-total {
            margin-top: 12px;
            padding-top: 12px;

            border-top: 2px solid #222;

            font-size: 1.15rem;
            font-weight: 800;
        }

        /* =========================================
           EMPTY / ERROR STATE
        ========================================= */

        .empty-state {
            padding: 50px 20px;
            text-align: center;

            background: #fafafa;
            border: 1px dashed #ccc;
            border-radius: 16px;
        }

        .empty-state h2 {
            margin-bottom: 8px;
        }

        .empty-state p {
            color: #777;
        }

        .orders-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;

            margin-top: 30px;
        }

        .logout-button {
            border: 1px solid #ddd;
            background: #fff;
            padding: 10px 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .logout-button:hover {
            background: #f5f5f5;
        }

        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 650px) {

            .orders-page {
                padding: 25px 15px 45px;
            }

            .order-card {
                padding: 18px;
            }

            .order-card-header {
                flex-direction: column;
                gap: 12px;
            }

            .order-meta {
                grid-template-columns: 1fr;
            }

            .status-timeline {
                display: block;
                margin: 25px 0;
            }

            .timeline-step {
                display: flex;
                align-items: center;
                gap: 12px;

                text-align: left;
                min-height: 42px;
            }

            .timeline-step:not(:last-child)::after {
                top: 30px;
                left: 14px;

                width: 3px;
                height: 100%;
            }

            .timeline-dot {
                flex-shrink: 0;
                margin: 0;
            }

            .timeline-label {
                font-size: 0.85rem;
            }

            .orders-actions {
                flex-direction: column;
                align-items: stretch;
            }
        }
    </style>
</head>



<body>

    <main class="orders-page">

        <header class="orders-header">

            <h1>My Orders</h1>

            <p
                id="auth-status"
                class="account-status"
            >
                Checking your account...
            </p>

        </header>

        <section
            id="orders-container"
            class="order-list"
            aria-live="polite"
        >
            <p>Loading your orders...</p>
        </section>

        <div class="orders-actions">

            <a href="index.html">
                ← Back to JulJones
            </a>

            <button
                id="logout-button"
                class="logout-button"
                type="button"
            >
                Log Out
            </button>

        </div>

    </main>


    <script type="module">

        import { supabase } from "./supabase-client.js";


        const authStatus =
            document.getElementById("auth-status");

        const ordersContainer =
            document.getElementById("orders-container");

        const logoutButton =
            document.getElementById("logout-button");


        let currentUser = null;


        /* =========================================
           STATUS HELPERS
        ========================================= */

        const statusLabels = {

            pending: "Order placed",

            confirmed: "Confirmed",

            preparing: "Preparing",

            ready: "Ready",

            out_for_delivery: "Out for delivery",

            completed: "Completed",

            cancelled: "Cancelled"

        };


        function formatStatus(status) {

            return statusLabels[status] || status;

        }


        function formatOrderType(type) {

            if (type === "pickup") {
                return "Pickup";
            }

            if (type === "delivery") {
                return "Delivery";
            }

            return type;

        }


        function formatCurrency(amount) {

            return `GHS ${Number(amount).toFixed(2)}`;

        }


        function formatDate(date) {

            return new Date(date).toLocaleString(
                undefined,
                {
                    dateStyle: "medium",
                    timeStyle: "short"
                }
            );

        }


        function statusClass(status) {

            return `status-${status.replaceAll("_", "-")}`;

        }


        /* =========================================
           ESCAPE DATABASE CONTENT
        ========================================= */

        function escapeHtml(value) {

            return String(value ?? "")
                .replaceAll("&", "&amp;")
                .replaceAll("<", "&lt;")
                .replaceAll(">", "&gt;")
                .replaceAll('"', "&quot;")
                .replaceAll("'", "&#039;");

        }


        /* =========================================
           STATUS TIMELINE
        ========================================= */

        function renderTimeline(status, orderType) {

            if (status === "cancelled") {

                return `
                    <div class="empty-state">
                        <strong>Order cancelled</strong>
                        <p>
                            This order has been cancelled.
                        </p>
                    </div>
                `;

            }


            const statuses =
                orderType === "delivery"
                    ? [
                        "pending",
                        "confirmed",
                        "preparing",
                        "ready",
                        "out_for_delivery",
                        "completed"
                    ]
                    : [
                        "pending",
                        "confirmed",
                        "preparing",
                        "ready",
                        "completed"
                    ];


            const currentIndex =
                statuses.indexOf(status);


            return `
                <div
                    class="status-timeline"
                    aria-label="Order progress"
                >

                    ${statuses.map((step, index) => {

                        const completed =
                            index < currentIndex;

                        const current =
                            index === currentIndex;

                        return `
                            <div
                                class="
                                    timeline-step
                                    ${completed ? "completed" : ""}
                                    ${current ? "current" : ""}
                                "
                            >

                                <div class="timeline-dot">
                                    ${
                                        completed
                                            ? "✓"
                                            : index + 1
                                    }
                                </div>

                                <span class="timeline-label">
                                    ${formatStatus(step)}
                                </span>

                            </div>
                        `;

                    }).join("")}

                </div>
            `;

        }


        /* =========================================
           LOAD ORDERS
        ========================================= */

        async function loadOrders() {

            ordersContainer.innerHTML =
                "<p>Loading your orders...</p>";


            const {
                data: orders,
                error
            } = await supabase

                .from("orders")

                .select(`
                    id,
                    order_number,
                    customer_name,
                    order_type,
                    delivery_address,
                    preferred_time,
                    special_instructions,
                    subtotal,
                    delivery_fee,
                    total_amount,
                    payment_method,
                    payment_status,
                    status,
                    created_at,
                    updated_at,
                    confirmed_at,
                    completed_at,
                    cancelled_at,
                    branch_id,

                    order_items (
                        id,
                        item_name,
                        unit_price,
                        quantity,
                        subtotal
                    )
                `)

                .eq(
                    "customer_id",
                    currentUser.id
                )

                .order(
                    "created_at",
                    {
                        ascending: false
                    }
                );


            if (error) {

                console.error(
                    "Order loading error:",
                    error
                );

                ordersContainer.innerHTML = `
                    <div class="empty-state">
                        <h2>Something went wrong</h2>
                        <p>
                            We couldn't load your orders.
                            Please try again.
                        </p>
                    </div>
                `;

                return;
            }


            if (!orders || orders.length === 0) {

                ordersContainer.innerHTML = `
                    <div class="empty-state">

                        <h2>No orders yet</h2>

                        <p>
                            Your future orders will appear here.
                        </p>

                        <p>
                            <a href="index.html">
                                Browse the JulJones menu →
                            </a>
                        </p>

                    </div>
                `;

                return;
            }


            ordersContainer.innerHTML = "";


            orders.forEach(order => {

                const orderElement =
                    document.createElement("article");


                orderElement.className =
                    "order-card";


                const itemsHtml =
                    (order.order_items || [])
                        .map(item => {

                            return `
                                <li class="order-item">

                                    <span>

                                        <span class="item-name">
                                            ${escapeHtml(
                                                item.item_name
                                            )}
                                        </span>

                                        <span class="item-quantity">
                                            × ${item.quantity}
                                        </span>

                                    </span>

                                    <span class="item-price">
                                        ${formatCurrency(
                                            item.subtotal
                                        )}
                                    </span>

                                </li>
                            `;

                        })
                        .join("");


                orderElement.innerHTML = `

                    <div class="order-card-header">

                        <div>

                            <h2 class="order-number">
                                Order #${order.order_number}
                            </h2>

                            <p class="order-date">
                                ${formatDate(order.created_at)}
                            </p>

                        </div>

                        <span
                            class="
                                status-badge
                                ${statusClass(order.status)}
                            "
                        >
                            ${formatStatus(order.status)}
                        </span>

                    </div>


                    ${renderTimeline(
                        order.status,
                        order.order_type
                    )}


                    <div class="order-meta">

                        <div class="meta-box">

                            <span class="meta-label">
                                Order type
                            </span>

                            <span class="meta-value">
                                ${formatOrderType(
                                    order.order_type
                                )}
                            </span>

                        </div>


                        <div class="meta-box">

                            <span class="meta-label">
                                Payment
                            </span>

                            <span class="meta-value">
                                ${escapeHtml(
                                    order.payment_method
                                )}
                            </span>

                        </div>

                    </div>


                    <h3>Items</h3>

                    <ul class="order-items">

                        ${itemsHtml}

                    </ul>


                    <div class="order-summary">

                        <div class="summary-row">

                            <span>
                                Subtotal
                            </span>

                            <span>
                                ${formatCurrency(
                                    order.subtotal
                                )}
                            </span>

                        </div>


                        <div class="summary-row">

                            <span>
                                Delivery
                            </span>

                            <span>
                                ${formatCurrency(
                                    order.delivery_fee
                                )}
                            </span>

                        </div>


                        <div
                            class="
                                summary-row
                                summary-total
                            "
                        >

                            <span>
                                Total
                            </span>

                            <span>
                                ${formatCurrency(
                                    order.total_amount
                                )}
                            </span>

                        </div>

                    </div>

                `;


                ordersContainer.appendChild(
                    orderElement
                );

            });

        }


        /* =========================================
           REALTIME
        ========================================= */

        function subscribeToOrderUpdates(userId) {

            const channel =
                supabase

                    .channel(
                        `customer-orders-${userId}`
                    )

                    .on(
                        "postgres_changes",
                        {
                            event: "UPDATE",
                            schema: "public",
                            table: "orders",
                            filter:
                                `customer_id=eq.${userId}`,
                        },

                        payload => {

                            console.log(
                                "REALTIME ORDER UPDATE:",
                                payload
                            );

                            loadOrders();

                        }
                    )

                    .subscribe(status => {

                        console.log(
                            "REALTIME STATUS:",
                            status
                        );

                    });


            return channel;

        }


        /* =========================================
           INITIALIZE
        ========================================= */

       async function initialize() {

    const {
        data: {
            session
        },
        error: sessionError
    } = await supabase.auth.getSession();


    if (
        sessionError ||
        !session?.user
    ) {

        window.location.replace(
            "login.html?redirect=orders.html"
        );

        return;
    }


    currentUser =
        session.user;


    authStatus.textContent =
        `Logged in as ${currentUser.email}`;


    await loadOrders();


    subscribeToOrderUpdates(
        currentUser.id
    );
}


        /* =========================================
           LOGOUT
        ========================================= */

        logoutButton.addEventListener(
            "click",
            async () => {

                logoutButton.disabled = true;

                logoutButton.textContent =
                    "Logging out...";


                const { error } =
                    await supabase.auth.signOut();


                if (error) {

                    console.error(
                        "Logout error:",
                        error
                    );

                    logoutButton.disabled =
                        false;

                    logoutButton.textContent =
                        "Log Out";

                    return;

                }


                window.location.href =
                    "index.html";

            }
        );


        initialize();

    </script>

</body>
</html>
