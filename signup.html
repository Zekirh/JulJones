<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account | JulJones</title>
    <meta
        name="description"
        content="Create a JulJones customer account to track your orders."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <section>
            <h1>Create your JulJones account</h1>
            <p>
                Create an account to keep track of your orders.
            </p>

            <form id="signup-form">

                <div>
                    <label for="full-name">Full name</label>
                    <input
                        type="text"
                        id="full-name"
                        name="full_name"
                        required
                        autocomplete="name"
                    >
                </div>

                <div>
                    <label for="phone">Phone number</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        required
                        autocomplete="tel"
                    >
                </div>

                <div>
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        autocomplete="email"
                    >
                </div>

                <div>
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        minlength="6"
                        autocomplete="new-password"
                    >
                </div>

                <button type="submit" id="signup-button">
                    Create Account
                </button>

                <p id="signup-message" role="alert"></p>

            </form>

            <p>
                Already have an account?
                <a href="login.html">Log in</a>
            </p>

            <p>
                <a href="index.html">Continue as guest</a>
            </p>
        </section>
    </main>

    <script type="module">
        import { supabase } from "./supabase-client.js";

        const form = document.getElementById("signup-form");
        const button = document.getElementById("signup-button");
        const message = document.getElementById("signup-message");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const fullName = document
                .getElementById("full-name")
                .value
                .trim();

            const phone = document
                .getElementById("phone")
                .value
                .trim();

            const email = document
                .getElementById("email")
                .value
                .trim();

            const password = document
                .getElementById("password")
                .value;

            message.textContent = "";
            button.disabled = true;
            button.textContent = "Creating account...";

            const { data, error } = await supabase.auth.signUp({
                email,
                password,
                options: {
                    data: {
                        full_name: fullName,
                        phone: phone
                    }
                }
            });

            if (error) {
                message.textContent = error.message;
                button.disabled = false;
                button.textContent = "Create Account";
                return;
            }

            if (data.session) {
                window.location.href = "orders.html";
                return;
            }

            message.textContent =
                "Account created. Please check your email to confirm your account.";

            button.disabled = false;
            button.textContent = "Create Account";
        });
    </script>

</body>
</html>
