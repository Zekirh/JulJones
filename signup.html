<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | JulJones</title>

    <meta
        name="description"
        content="Create a JulJones customer account to track your orders."
    >

    <link rel="stylesheet" href="auth.css">

</head>


<body>

    <main class="auth-page">

        <div class="auth-container">


            <div class="auth-brand">

                <a href="index.html">

                    <p class="auth-brand-name">
                        JULJONES
                    </p>

                    <p class="auth-brand-tagline">
                        Good food. Simply ordered.
                    </p>

                </a>

            </div>


            <section class="auth-card">


                <div class="auth-heading">

                    <h1>
                        Create your account
                    </h1>

                    <p>
                        Save your details and
                        keep track of your orders.
                    </p>

                </div>


                <form
                    id="signup-form"
                    class="auth-form"
                >


                    <div class="form-field">

                        <label for="full-name">
                            Full name
                        </label>

                        <input
                            type="text"
                            id="full-name"
                            name="full_name"
                            placeholder="Your full name"
                            required
                            autocomplete="name"
                        >

                    </div>


                    <div class="form-field">

                        <label for="phone">
                            Phone number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="e.g. 024 123 4567"
                            required
                            autocomplete="tel"
                        >

                    </div>


                    <div class="form-field">

                        <label for="email">
                            Email
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="you@example.com"
                            required
                            autocomplete="email"
                        >

                    </div>


                    <div class="form-field">

                        <label for="password">
                            Password
                        </label>

                        <div class="password-wrapper">

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="At least 6 characters"
                                required
                                minlength="6"
                                autocomplete="new-password"
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                id="password-toggle"
                                aria-label="Show password"
                            >
                                Show
                            </button>

                        </div>

                    </div>


                    <button
                        type="submit"
                        id="signup-button"
                        class="auth-button"
                    >
                        Create Account
                    </button>


                    <p
                        id="signup-message"
                        class="auth-message"
                        role="alert"
                    ></p>


                </form>


                <div class="auth-footer">

                    <p>
                        Already have an account?
                        <a
                         href="login.html?redirect=orders.html"
>
                            Log in
                        </a>
                    </p>

                    <a
                        href="index.html"
                        class="auth-guest"
                    >
                        ← Continue as guest
                    </a>

                </div>


            </section>


        </div>

    </main>


    <script type="module">

        import { supabase }
            from "./supabase-client.js";


        const form =
            document.getElementById("signup-form");

        const button =
            document.getElementById("signup-button");

        const message =
            document.getElementById("signup-message");

        const passwordInput =
            document.getElementById("password");

        const passwordToggle =
            document.getElementById("password-toggle");


        /* =========================================
           PASSWORD VISIBILITY
        ========================================= */

        passwordToggle.addEventListener(
            "click",
            () => {

                const isPassword =
                    passwordInput.type === "password";


                passwordInput.type =
                    isPassword
                        ? "text"
                        : "password";


                passwordToggle.textContent =
                    isPassword
                        ? "Hide"
                        : "Show";


                passwordToggle.setAttribute(
                    "aria-label",
                    isPassword
                        ? "Hide password"
                        : "Show password"
                );

            }
        );


        /* =========================================
           SIGNUP
        ========================================= */

        form.addEventListener(
            "submit",
            async (event) => {

                event.preventDefault();


                const fullName =
                    document
                        .getElementById("full-name")
                        .value
                        .trim();


                const phone =
                    document
                        .getElementById("phone")
                        .value
                        .trim();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    passwordInput.value;


                message.textContent = "";

                message.className =
                    "auth-message";


                button.disabled = true;

                button.textContent =
                    "Creating account...";


                const {
                    data,
                    error
                } = await supabase.auth.signUp({

                    email,

                    password,

                    options: {

                        data: {

                            full_name:
                                fullName,

                            phone:
                                phone

                        }

                    }

                });


                if (error) {

                    console.error(
                        "Signup error:",
                        error
                    );


                    message.textContent =
                        "We couldn't create your account. Please check your details and try again.";

                    message.className =
                        "auth-message error";


                    button.disabled = false;

                    button.textContent =
                        "Create Account";

                    return;

                }


                if (data.session) {

                   const params =
    new URLSearchParams(
        window.location.search
    );

           const redirect =
             params.get("redirect") ||
          "orders.html";

           window.location.href =
             redirect; window.location.href =
                        "orders.html";

                    return;

                }


                message.textContent =
                    "Account created. Please check your email to confirm your account.";

                message.className =
                    "auth-message success";


                button.disabled = false;

                button.textContent =
                    "Create Account";

            }
        );

    </script>

</body>

</html>
