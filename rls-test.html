<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JulJones RLS Role Test</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 950px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.5;
        }

        h1 {
            margin-bottom: 10px;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 20px 0;
        }

        button {
            padding: 10px 16px;
            cursor: pointer;
        }

        #output {
            background: #111;
            color: #eee;
            padding: 20px;
            border-radius: 8px;
            min-height: 350px;
            white-space: pre-wrap;
            overflow-x: auto;
        }
    </style>
</head>

<body>

    <h1>JulJones RLS Role Test</h1>

    <div class="controls">

        <button id="testStatus">
         Test Order Status Update
        </button>

        <button id="login">
            Login
        </button>

        <button id="signOut">
            Sign Out
        </button>

        <button id="checkRole">
            Check My Role
        </button>

        <button id="testOrders">
            Test Order Access
        </button>

        <button id="testPayments">
            Test Payment Access
        </button>

        <button id="testProfiles">
            Test Profile Access
        </button>

    </div>

    <pre id="output"></pre>


    <script type="module">

        import {
            createClient
        } from "https://esm.sh/@supabase/supabase-js@2";


        /*
        ============================================================
        SUPABASE CONFIG
        ============================================================
        */

       const SUPABASE_URL = "https://ojvcwtjcbszenatgeyco.supabase.co";
const SUPABASE_KEY = "sb_publishable_InK1Q2kRf9Dsfo9vTTAEYw_p_RrP4gk";


        const supabase = createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


        /*
        ============================================================
        OUTPUT
        ============================================================
        */

        const output =
            document.getElementById("output");


        function log(message) {

            output.textContent +=
                `${message}\n`;

        }


        /*
        ============================================================
        LOGIN
        ============================================================
        */

        document
            .getElementById("login")
            .addEventListener("click", async () => {

                output.textContent = "";

                const email =
                    prompt("Email:");

                const password =
                    prompt("Password:");

                if (!email || !password) {

                    log(
                        "Login cancelled."
                    );

                    return;
                }


                const {
                    data,
                    error
                } = await supabase.auth.signInWithPassword({
                    email,
                    password
                });


                if (error) {

                    log(
                        `LOGIN FAILED ❌\n${error.message}`
                    );

                    return;
                }


                log(
                    "LOGIN SUCCESSFUL ✅"
                );

                log("");

                log(
                    `Authenticated user:\n${data.user.id}`
                );

            });


        /*
        ============================================================
        SIGN OUT
        ============================================================
        */

        document
            .getElementById("signOut")
            .addEventListener("click", async () => {

                const {
                    error
                } = await supabase.auth.signOut();


                if (error) {

                    log(
                        `SIGN OUT FAILED ❌\n${error.message}`
                    );

                    return;
                }


                output.textContent = "";

                log(
                    "Signed out successfully ✅"
                );

            });


        /*
        ============================================================
        CHECK ROLE
        ============================================================
        */

        document
            .getElementById("checkRole")
            .addEventListener("click", async () => {

                output.textContent = "";


                const {
                    data: {
                        user
                    }
                } = await supabase.auth.getUser();


                if (!user) {

                    log(
                        "No authenticated user ❌"
                    );

                    return;
                }


                const {
                    data,
                    error
                } = await supabase
                    .from("profiles")
                    .select("id, full_name, phone, role")
                    .eq("id", user.id)
                    .single();


                if (error) {

                    log(
                        `PROFILE QUERY FAILED ❌\n${error.message}`
                    );

                    return;
                }


                log(
                    "AUTHENTICATED USER ✅"
                );

                log("");

                log(
                    `ID: ${data.id}`
                );

                log(
                    `Role: ${data.role}`
                );

            });


        /*
        ============================================================
        TEST ORDER ACCESS
        ============================================================
        */

        document
            .getElementById("testOrders")
            .addEventListener("click", async () => {

                output.textContent = "";


                const {
                    data: {
                        user
                    }
                } = await supabase.auth.getUser();


                if (!user) {

                    log(
                        "No authenticated user ❌"
                    );

                    return;
                }


                const {
                    data: profile
                } = await supabase
                    .from("profiles")
                    .select("role")
                    .eq("id", user.id)
                    .single();


                log(
                    `Testing order access as: ${profile?.role ?? "unknown"}`
                );

                log("");


                const {
                    data: orders,
                    error
                } = await supabase
                    .from("orders")
                    .select(
                        "id, order_number, customer_name, total_amount, status, customer_id"
                    )
                    .order(
                        "created_at",
                        {
                            ascending: false
                        }
                    );


                if (error) {

                    log(
                        `Order query failed ❌\n${error.message}`
                    );

                    return;
                }


                if (!orders || orders.length === 0) {

                    log(
                        "No visible orders."
                    );

                    return;
                }


                log(
                    `${orders.length} order(s) visible ✅`
                );

                log("");


                orders.forEach(order => {

                    log(
                        `Order #${order.order_number}`
                    );

                    log(
                        `Customer: ${order.customer_name}`
                    );

                    log(
                        `Amount: GHS ${order.total_amount}`
                    );

                    log(
                        `Status: ${order.status}`
                    );

                    log(
                        `Customer ID: ${order.customer_id}`
                    );

                    log("");

                });

            });


        /*
        ============================================================
        TEST PAYMENT ACCESS
        ============================================================
        */

        document
            .getElementById("testPayments")
            .addEventListener("click", async () => {

                output.textContent = "";


                const {
                    data: {
                        user
                    }
                } = await supabase.auth.getUser();


                if (!user) {

                    log(
                        "No authenticated user ❌"
                    );

                    return;
                }


                const {
                    data: profile
                } = await supabase
                    .from("profiles")
                    .select("role")
                    .eq("id", user.id)
                    .single();


                log(
                    `Testing payment access as: ${profile?.role ?? "unknown"}`
                );

                log("");


                const {
                    data: payments,
                    error
                } = await supabase
                    .from("payments")
                    .select("*");


                if (error) {

                    log(
                        `Payment query failed ❌\n${error.message}`
                    );

                    return;
                }


                if (!payments || payments.length === 0) {

                    log(
                        "No visible payments ✅"
                    );

                    return;
                }


                log(
                    `${payments.length} payment record(s) visible ✅`
                );

                log(
                    JSON.stringify(
                        payments,
                        null,
                        2
                    )
                );

            });


        /*
        ============================================================
        TEST PROFILE ACCESS
        ============================================================
        */

        document
            .getElementById("testProfiles")
            .addEventListener("click", async () => {

                output.textContent = "";


                const {
                    data: profiles,
                    error
                } = await supabase
                    .from("profiles")
                    .select("*");


                if (error) {

                    log(
                        `Profile query failed ❌\n${error.message}`
                    );

                    return;
                }


                if (!profiles || profiles.length === 0) {

                    log(
                        "No profiles visible."
                    );

                    return;
                }


                log(
                    `${profiles.length} profile(s) visible:`
                );

                log("");

                profiles.forEach(profile => {

                    log(
                        `${profile.id} → ${profile.role}`
                    );

                });

            });

document
    .getElementById("testStatus")
    .addEventListener("click", async () => {

        const orderId = prompt(
            "Enter the test order UUID:"
        );

        if (!orderId) {
            return;
        }

        const {
            data,
            error
        } = await supabase.rpc(
            "update_order_status",
            {
                p_order_id: orderId,
                p_new_status: "completed"
            }
        );

        if (error) {
            log(
                `STATUS UPDATE FAILED ❌\n${error.message}`
            );
            return;
        }

        log(
            "STATUS UPDATE SUCCESSFUL ✅"
        );

        log(
            `New status: ${data.status}`
        );
    });



    </script>

</body>

</html>
