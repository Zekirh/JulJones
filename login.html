<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | JulJones</title>
    <meta
        name="description"
        content="Log in to your JulJones account to view and track your orders."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main>
        <section>
            <h1>Welcome back</h1>
            <p>Log in to view and track your JulJones orders.</p>

            <form id="login-form">

                <div>
                    <label for="email">Email</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        required
                        autocomplete="email"
                    >
                </div>

                <div>
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        required
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" id="login-button">
                    Log In
                </button>

                <p id="login-message" role="alert"></p>

            </form>

            <p>
                Don't have an account?
                <a href="signup.html">Create one</a>
            </p>

            <p>
                <a href="index.html">Continue as guest</a>
            </p>
        </section>
    </main>

    <script type="module">
        import { supabase } from "./supabase-client.js";

        const form = document.getElementById("login-form");
        const button = document.getElementById("login-button");
        const message = document.getElementById("login-message");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();

            const email = document
                .getElementById("email")
                .value
                .trim();

            const password = document
                .getElementById("password")
                .value;

            message.textContent = "";
            button.disabled = true;
            button.textContent = "Logging in...";

            const { error } = await supabase.auth.signInWithPassword({
                email,
                password
            });

            if (error) {
                message.textContent = error.message;
                button.disabled = false;
                button.textContent = "Log In";
                return;
            }

            window.location.href = "orders.html";
        });
    </script>

</body>
</html>
